<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAD Pro HUD</title>
  <link rel="icon" type="image/png" href="../build/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #hud-pill {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 14px;
      background: #0B1120;
      border: 1.5px solid var(--layer-color, #38BDF8);
      border-radius: 9999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), inset 0 -1px 0 rgba(0, 0, 0, 0.5);
      cursor: grab;
      -webkit-app-region: drag;
      transition: border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    #hud-pill * {
      -webkit-app-region: drag;
    }

    #hud-pill:active {
      cursor: grabbing;
    }

    #hud-pill.active-press {
      border-color: #FFFFFF;
      box-shadow: inset 0 0 10px var(--layer-glow, rgba(56, 189, 248, 0.4)), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transform: scale(1.02);
    }

    #hud-pill.playing-sound {
      border-color: #38BDF8 !important;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5), inset 0 0 12px rgba(56, 189, 248, 0.3) !important;
      animation: pulse-sound 1.4s infinite ease-in-out;
    }

    @keyframes pulse-sound {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--layer-color, #38BDF8);
      box-shadow: 0 0 8px var(--layer-color, #38BDF8);
      margin-right: 7px;
      flex-shrink: 0;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .layer-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #F8FAFC;
      margin-right: 7px;
      flex-shrink: 0;
    }

    .separator {
      font-size: 11px;
      color: #334155;
      margin-right: 7px;
      flex-shrink: 0;
    }

    .action-text {
      font-size: 11px;
      font-weight: 500;
      color: #94A3B8;
      transition: color 0.2s ease;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-text.highlight {
      color: #FFFFFF;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="hud-pill">
    <span class="dot" id="hud-dot"></span>
    <span class="layer-name" id="hud-layer">CAMADA 0</span>
    <span class="separator">│</span>
    <span class="action-text" id="hud-action">PADRÃO</span>
  </div>

  <script src="hud.js"></script>
</body>
</html>
